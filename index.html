<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed — Internet tezligi</title>
<style>
:root{--bg:#070b13;--text:#eef2f8;--dim:rgba(220,230,245,.52);--hair:rgba(255,255,255,.10);--accent:#7fa8ff}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:"SF Pro Display","Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;align-items:flex-start;padding:clamp(16px,5vw,56px) 16px 56px;position:relative;overflow-x:hidden}

/* light sources the glass refracts */
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.55}
.o1{width:520px;height:520px;left:-120px;top:-100px;background:#1f4fd8;animation:d1 38s ease-in-out infinite alternate}
.o2{width:460px;height:460px;right:-140px;top:28%;background:#0f8fa3;opacity:.38;animation:d2 44s ease-in-out infinite alternate}
.o3{width:420px;height:420px;left:25%;bottom:-180px;background:#4b3fb8;opacity:.42;animation:d3 50s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(160px,120px)}}
@keyframes d2{to{transform:translate(-140px,-90px)}}
@keyframes d3{to{transform:translate(120px,-110px)}}

.glass{position:relative;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);border:1px solid var(--hair);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 40px 90px -20px rgba(0,0,0,.65)}
.panel{width:min(100%,540px);padding:26px 28px 8px;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.brand{font-weight:600;letter-spacing:.01em}
.srvline{color:var(--dim);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#5b6b80;transition:background .4s}
.dot.on{background:#6fe0b0}

.gauge{position:relative;width:min(100%,400px);margin:14px auto 0}
svg{width:100%;display:block;overflow:visible}
.track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:5;stroke-linecap:round}
.prog{fill:none;stroke:url(#g);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(127,168,255,.45))}
.tk{stroke:rgba(255,255,255,.14);stroke-width:1}
.tk.big{stroke:rgba(255,255,255,.34)}
.lb{fill:rgba(220,230,245,.45);font-size:11px;text-anchor:middle}
.knob{fill:#fff;filter:drop-shadow(0 0 6px rgba(160,195,255,.9))}
.read{position:absolute;left:0;right:0;top:55%;text-align:center}
.val{font-size:clamp(3.4rem,14vw,4.8rem);font-weight:200;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{margin-top:6px;font-size:.95rem;color:var(--dim)}
.phase{text-align:center;margin-top:2px;font-size:.85rem;color:var(--dim);height:1.2em}

.act{display:flex;justify-content:center;margin:16px 0 22px}
button{font:500 .98rem inherit;font-family:inherit;color:#0a1020;background:linear-gradient(180deg,#ffffff,#d9e4f7);border:0;border-radius:999px;padding:13px 40px;cursor:pointer;box-shadow:0 8px 24px -8px rgba(120,160,255,.6),inset 0 1px 0 #fff;transition:transform .25s ease,box-shadow .25s ease,opacity .25s}
button:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(120,160,255,.75),inset 0 1px 0 #fff}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.5;cursor:wait;transform:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair)}
.st{padding:16px 0 16px 16px;border-left:1px solid var(--hair)}
.st:first-child{border-left:0;padding-left:0}
.st small{display:block;font-size:.75rem;color:var(--dim)}
.st b{display:block;margin-top:5px;font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.st b em{font-style:normal;font-size:.72rem;font-weight:400;color:var(--dim);margin-left:3px}

details{border-top:1px solid var(--hair)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:.9rem}
summary::-webkit-details-marker{display:none}
summary svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:2;transition:transform .3s}
details[open] summary svg{transform:rotate(180deg)}
.rows{padding-bottom:8px;animation:op .35s ease}
@keyframes op{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.88rem}
.row span:first-child{color:var(--dim)}
.row span:last-child{text-align:right}
.err{margin:0 0 14px;text-align:center;font-size:.83rem;color:#ff9aa8}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.st:nth-child(3){border-left:0;padding-left:0}.st:nth-child(n+3){border-top:1px solid var(--hair)}.panel{padding:22px 20px 6px}}
@media(prefers-reduced-motion:reduce){.orb,.rows{animation:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<main class="glass panel">
  <div class="top">
    <span class="brand">Speed</span>
    <span class="srvline"><span class="dot" id="dot"></span><span id="srvTop">Server tanlanmagan</span></span>
  </div>

  <div class="gauge">
    <svg viewBox="0 0 400 320" aria-label="Tezlik o'lchagich">
      <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="70" y1="300" x2="330" y2="80"><stop offset="0" stop-color="#4f7dff"/><stop offset="1" stop-color="#bfe4ff"/></linearGradient></defs>
      <path class="track" d="M 93.9 306.1 A 150 150 0 1 1 306.1 306.1"/>
      <path id="prog" class="prog" d="M 93.9 306.1 A 150 150 0 1 1 306.1 306.1" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000"/>
      <g id="ticks"></g>
      <g id="knob" transform="rotate(-135 200 200)"><circle class="knob" cx="200" cy="50" r="6.5"/></g>
    </svg>
    <div class="read"><div class="val" id="val">0</div><div class="unit">Mbps</div></div>
  </div>
  <div class="phase" id="phase">Tayyor</div>

  <div class="act"><button id="go">Testni boshlash</button></div>
  <div class="err" id="err" hidden></div>

  <div class="stats">
    <div class="st"><small>Yuklab olish</small><b id="dl">—</b></div>
    <div class="st"><small>Yuklash</small><b id="ul">—</b></div>
    <div class="st"><small>Ping</small><b id="pg">—</b></div>
    <div class="st"><small>Jitter</small><b id="jt">—</b></div>
  </div>

  <details>
    <summary>Batafsil ma'lumot<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
    <div class="rows">
      <div class="row"><span>Latency (o'rtacha)</span><span id="lat">—</span></div>
      <div class="row"><span>Ping (eng kam)</span><span id="pmin">—</span></div>
      <div class="row"><span>Server</span><span id="srv">—</span></div>
      <div class="row"><span>Provayder</span><span id="isp">—</span></div>
      <div class="row"><span>IP manzil</span><span id="ip">—</span></div>
    </div>
  </details>
</main>

<script>
const $=id=>document.getElementById(id),BASE="https://speed.cloudflare.com";
const START=-135,SWEEP=270;
let target=0,shown=0,maxT=100,maxS=100,last=performance.now();

function pol(a,r){const t=(a-90)*Math.PI/180;return[200+r*Math.cos(t),200+r*Math.sin(t)]}
function ticks(){
  let h="";
  for(let i=0;i<=50;i++){
    const a=START+SWEEP*i/50,big=i%10===0,[x1,y1]=pol(a,big?132:131),[x2,y2]=pol(a,big?120:124);
    h+=`<line class="tk${big?" big":""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if(big){const[x,y]=pol(a,104);h+=`<text class="lb" x="${x}" y="${y+4}">${Math.round(maxT*i/50)}</text>`}
  }
  $("ticks").innerHTML=h;
}
function setSpeed(m){
  target=m;
  const nm=m<=100?100:m<=250?250:m<=500?500:m<=1000?1000:2500;
  if(nm!==maxT){maxT=nm;ticks()}
}
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  shown+=(target-shown)*(1-Math.exp(-dt*5));
  maxS+=(maxT-maxS)*(1-Math.exp(-dt*3.5));
  const f=Math.max(0,Math.min(shown/maxS,1));
  $("knob").setAttribute("transform",`rotate(${START+SWEEP*f} 200 200)`);
  $("prog").setAttribute("stroke-dashoffset",1000-f*1000);
  $("val").textContent=shown<10?shown.toFixed(2):shown<100?shown.toFixed(1):Math.round(shown);
  requestAnimationFrame(frame);
}
const show=(id,bps)=>$(id).innerHTML=(bps/1e6).toFixed(bps<1e7?2:1)+"<em>Mbps</em>";

async function ping(){
  const t=[];
  for(let i=0;i<11;i++){
    const s=performance.now();
    await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`,{cache:"no-store"});
    if(i)t.push(performance.now()-s);
  }
  const avg=t.reduce((a,b)=>a+b)/t.length;
  const jit=t.slice(1).reduce((a,v,i)=>a+Math.abs(v-t[i]),0)/(t.length-1);
  return{avg,min:Math.min(...t),jit};
}
async function download(ms=8000){
  const ctrl=new AbortController(),t0=performance.now(),end=t0+ms;
  let bytes=0,s=[];
  const iv=setInterval(()=>{
    const n=performance.now();s.push([n,bytes]);s=s.filter(x=>n-x[0]<1500);
    if(s.length>2&&n-t0>400){const a=s[0],b=s.at(-1);setSpeed((b[1]-a[1])*8/((b[0]-a[0])/1000)/1e6)}
  },120);
  async function w(){
    while(performance.now()<end){
      const r=await fetch(`${BASE}/__down?bytes=50000000&r=${Math.random()}`,{cache:"no-store",signal:ctrl.signal});
      const rd=r.body.getReader();
      for(;;){const{done,value}=await rd.read();if(done)break;bytes+=value.length;if(performance.now()>=end){ctrl.abort();return}}
    }
  }
  try{await Promise.all([w(),w(),w(),w()])}catch(e){if(e.name!=="AbortError")throw e}
  clearInterval(iv);
  return bytes*8/((performance.now()-t0)/1000);
}
async function upload(ms=6000){
  const blob=new Blob([new Uint8Array(2e6)]),t0=performance.now(),end=t0+ms;let bytes=0;
  async function w(){
    while(performance.now()<end){
      await fetch(`${BASE}/__up`,{method:"POST",body:blob,cache:"no-store"});
      bytes+=blob.size;setSpeed(bytes*8/((performance.now()-t0)/1000)/1e6);
    }
  }
  await Promise.all([w(),w(),w()]);
  return bytes*8/((performance.now()-t0)/1000);
}
async function meta(){
  try{
    const m=await(await fetch(`${BASE}/meta`,{cache:"no-store"})).json(),c=m.colo||{};
    const name=[c.city||m.city,m.country].filter(Boolean).join(", ")||"Cloudflare";
    $("srv").textContent=name+(c.iata?` (${c.iata})`:"");$("srvTop").textContent=name;$("dot").classList.add("on");
    $("isp").textContent=m.asOrganization||"—";$("ip").textContent=m.clientIp||"—";
  }catch{$("srv").textContent="Cloudflare";$("srvTop").textContent="Cloudflare"}
}
const ph=t=>$("phase").textContent=t;
$("go").onclick=async()=>{
  const b=$("go");b.disabled=true;$("err").hidden=true;
  ["dl","ul","pg","jt","lat","pmin"].forEach(i=>$(i).textContent="—");
  setSpeed(0);
  try{
    ph("Server aniqlanmoqda");await meta();
    ph("Ping o'lchanmoqda");
    const p=await ping();
    $("pg").innerHTML=Math.round(p.min)+"<em>ms</em>";$("jt").innerHTML=p.jit.toFixed(1)+"<em>ms</em>";
    $("lat").textContent=p.avg.toFixed(1)+" ms";$("pmin").textContent=p.min.toFixed(1)+" ms";
    ph("Yuklab olish tezligi o'lchanmoqda");
    const d=await download();show("dl",d);setSpeed(d/1e6);
    await new Promise(r=>setTimeout(r,900));
    setSpeed(0);ph("Yuklash tezligi o'lchanmoqda");
    const u=await upload();show("ul",u);setSpeed(u/1e6);
    ph("Test yakunlandi");
  }catch{
    $("err").textContent="O'lchab bo'lmadi. Internetni tekshiring yoki VPN / reklama blokerni o'chiring.";
    $("err").hidden=false;setSpeed(0);ph("Xatolik");
  }
  b.disabled=false;b.textContent="Qayta o'lchash";
};
ticks();requestAnimationFrame(frame);
</script>
</body>
</html>
